name: 'build'

on:
    workflow_dispatch:
    schedule:
        - cron: "58 1 * * 5"
    push:
        branches:
            - master
    pull_request:
jobs:
    build:
        name: 'Build'
        runs-on: ubuntu-latest
        steps:
          - name: "Build:checkout"
            uses: actions/checkout@v2
          - name: "Set environment variables"
            run: |
                echo "GITHUB_SHA_SHORT=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "${GITHUB_ENV}"
                echo "VCS_REF=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "${GITHUB_ENV}"
                echo "BUILD_DATE=$(TZ=Europe/Paris date -Iseconds)" >> "${GITHUB_ENV}"
          - name: 'Login to github container registry'
            uses: docker/login-action@v1
            with:
                registry: ghcr.io
                username: ${{ secrets.CR_USER }}
                password: ${{ secrets.CR_PAT }}
          - name: 'Login to docker hub'
            uses: docker/login-action@v1
            with:
                username: ${{ secrets.DH_USER }}
                password: ${{ secrets.DH_PAT }}
          - name: 'Build image ubuntu-base ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/ubuntu-base/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/ubuntu-base/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/ubuntu-base:latest,ghcr.io/${{ secrets.CR_USER }}/ubuntu-base:1.28,ghcr.io/${{ secrets.CR_USER }}/ubuntu-base:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/ubuntu-base:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/ubuntu-base:latest,${{ secrets.CR_USER }}/ubuntu-base:1.28,${{ secrets.CR_USER }}/ubuntu-base:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/ubuntu-base:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image ubuntu-unmin ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/ubuntu-unmin/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/ubuntu-unmin/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/ubuntu-unmin:latest,ghcr.io/${{ secrets.CR_USER }}/ubuntu-unmin:1.28,ghcr.io/${{ secrets.CR_USER }}/ubuntu-unmin:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/ubuntu-unmin:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/ubuntu-unmin:latest,${{ secrets.CR_USER }}/ubuntu-unmin:1.28,${{ secrets.CR_USER }}/ubuntu-unmin:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/ubuntu-unmin:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/dev/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/dev:latest,ghcr.io/${{ secrets.CR_USER }}/dev:1.28,ghcr.io/${{ secrets.CR_USER }}/dev:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/dev:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev:latest,${{ secrets.CR_USER }}/dev:1.28,${{ secrets.CR_USER }}/dev:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev-lang ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/dev-lang/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev-lang/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/dev-lang:latest,ghcr.io/${{ secrets.CR_USER }}/dev-lang:1.28,ghcr.io/${{ secrets.CR_USER }}/dev-lang:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/dev-lang:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev-lang:latest,${{ secrets.CR_USER }}/dev-lang:1.28,${{ secrets.CR_USER }}/dev-lang:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev-lang:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev-lang-java ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/dev-lang-java/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev-lang-java/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/dev-lang-java:latest,ghcr.io/${{ secrets.CR_USER }}/dev-lang-java:1.28,ghcr.io/${{ secrets.CR_USER }}/dev-lang-java:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/dev-lang-java:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev-lang-java:latest,${{ secrets.CR_USER }}/dev-lang-java:1.28,${{ secrets.CR_USER }}/dev-lang-java:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev-lang-java:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev-dl ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/dev-dl/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev-dl/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/dev-dl:latest,ghcr.io/${{ secrets.CR_USER }}/dev-dl:1.28,ghcr.io/${{ secrets.CR_USER }}/dev-dl:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/dev-dl:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev-dl:latest,${{ secrets.CR_USER }}/dev-dl:1.28,${{ secrets.CR_USER }}/dev-dl:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/dev-dl:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image irssi ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v2
            with:
                context: dockerfiles/ghcr/irssi/
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/irssi/Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                tags: ghcr.io/${{ secrets.CR_USER }}/irssi:latest,ghcr.io/${{ secrets.CR_USER }}/irssi:1.28,ghcr.io/${{ secrets.CR_USER }}/irssi:1.28-${{ env.GITHUB_SHA_SHORT }},ghcr.io/${{ secrets.CR_USER }}/irssi:${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/irssi:latest,${{ secrets.CR_USER }}/irssi:1.28,${{ secrets.CR_USER }}/irssi:1.28-${{ env.GITHUB_SHA_SHORT }},${{ secrets.CR_USER }}/irssi:${{ env.GITHUB_SHA_SHORT }}
