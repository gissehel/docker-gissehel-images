name: 'build'

on:
    workflow_dispatch:
    schedule:
        - cron: "58 1 * * 5"
    push:
        branches:
            - master
jobs:
    build:
        name: 'Build'
        runs-on: ubuntu-latest
        steps:
          - name: "Build:checkout"
            uses: actions/checkout@v4
            with:
                submodules: true
                fetch-depth: 0

          - name: "Set environment variables"
            run: |
                export_ga() {
                    for _name in "${@}"
                    do
                        local _key="${_name%%=*}"
                        local _value="${_name#*=}"
                        [ "${_key}" == "${_name}" ] && _value="${!_name}"
                        export $_key="${_value}"
                        echo "${_key}=${_value}" >> "${GITHUB_ENV}"
                    done
                }

                export_ga GITHUB_SHA_SHORT="$(git rev-parse --short HEAD)"
                export_ga VCS_REF="${GITHUB_SHA_SHORT}"
                export_ga BUILD_DATE="$(TZ=Europe/Paris date -Iseconds)"

                export_ga GH_REGISTRY="ghcr.io"
                export_ga GH_USER="${{ github.actor }}"
                export_ga GH_PREFIX="${GH_REGISTRY}/${GH_USER}"
                export_ga DOCKER_HUB_REGISTRY="docker.io"
                export_ga DOCKER_HUB_USER="${{ vars.DOCKER_HUB_USER }}"
                export_ga DOCKER_HUB_PREFIX="${DOCKER_HUB_REGISTRY}/${DOCKER_HUB_USER}"

          - name: "Install cosign"
            uses: "sigstore/cosign-installer@v4.1.0"
            with:
                cosign-release: "v3.0.6"
          # Workaround: https://github.com/docker/build-push-action/issues/461

          - name: "Setup Docker buildx"
            uses: "docker/setup-buildx-action@v4"

          - name: 'Login to github container registry'
            uses: docker/login-action@v4
            with:
                registry: "${{ env.GH_REGISTRY }}"
                username: "${{ env.GH_USER }}"
                password: "${{ secrets.GITHUB_TOKEN }}"

          - name: 'Login to docker hub'
            uses: docker/login-action@v4
            with:
                registry: "${{ env.DOCKER_HUB_REGISTRY }}"
                username: "${{ env.DOCKER_HUB_USER }}"
                password: "${{ secrets.DOCKER_HUB_TOKEN }}"

          - name: 'Build image ubuntu-base ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/ubuntu-base/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/ubuntu-base/Dockerfile
                tags: ${{ env.GH_PREFIX }}/ubuntu-base:latest,${{ env.GH_PREFIX }}/ubuntu-base:1.28,${{ env.GH_PREFIX }}/ubuntu-base:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/ubuntu-base:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/ubuntu-base:latest,${{ env.DOCKER_HUB_PREFIX }}/ubuntu-base:1.28,${{ env.DOCKER_HUB_PREFIX }}/ubuntu-base:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/ubuntu-base:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image ubuntu-unmin ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/ubuntu-unmin/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/ubuntu-unmin/Dockerfile
                tags: ${{ env.GH_PREFIX }}/ubuntu-unmin:latest,${{ env.GH_PREFIX }}/ubuntu-unmin:1.28,${{ env.GH_PREFIX }}/ubuntu-unmin:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/ubuntu-unmin:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/ubuntu-unmin:latest,${{ env.DOCKER_HUB_PREFIX }}/ubuntu-unmin:1.28,${{ env.DOCKER_HUB_PREFIX }}/ubuntu-unmin:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/ubuntu-unmin:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/dev/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev/Dockerfile
                tags: ${{ env.GH_PREFIX }}/dev:latest,${{ env.GH_PREFIX }}/dev:1.28,${{ env.GH_PREFIX }}/dev:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/dev:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev:latest,${{ env.DOCKER_HUB_PREFIX }}/dev:1.28,${{ env.DOCKER_HUB_PREFIX }}/dev:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev-lang ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/dev-lang/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev-lang/Dockerfile
                tags: ${{ env.GH_PREFIX }}/dev-lang:latest,${{ env.GH_PREFIX }}/dev-lang:1.28,${{ env.GH_PREFIX }}/dev-lang:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/dev-lang:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev-lang:latest,${{ env.DOCKER_HUB_PREFIX }}/dev-lang:1.28,${{ env.DOCKER_HUB_PREFIX }}/dev-lang:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev-lang:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev-lang-java ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/dev-lang-java/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev-lang-java/Dockerfile
                tags: ${{ env.GH_PREFIX }}/dev-lang-java:latest,${{ env.GH_PREFIX }}/dev-lang-java:1.28,${{ env.GH_PREFIX }}/dev-lang-java:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/dev-lang-java:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev-lang-java:latest,${{ env.DOCKER_HUB_PREFIX }}/dev-lang-java:1.28,${{ env.DOCKER_HUB_PREFIX }}/dev-lang-java:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev-lang-java:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image dev-dl ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/dev-dl/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/dev-dl/Dockerfile
                tags: ${{ env.GH_PREFIX }}/dev-dl:latest,${{ env.GH_PREFIX }}/dev-dl:1.28,${{ env.GH_PREFIX }}/dev-dl:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/dev-dl:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev-dl:latest,${{ env.DOCKER_HUB_PREFIX }}/dev-dl:1.28,${{ env.DOCKER_HUB_PREFIX }}/dev-dl:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/dev-dl:${{ env.GITHUB_SHA_SHORT }}
          - name: 'Build image irssi ${{ env.GITHUB_SHA_SHORT }}'
            uses: docker/build-push-action@v4.0.0
            with:
                context: dockerfiles/ghcr/irssi/
                push: true
                build-args: |
                    VCS_REF=${{ env.VCS_REF }}
                    BUILD_DATE=${{ env.BUILD_DATE }}
                file: dockerfiles/ghcr/irssi/Dockerfile
                tags: ${{ env.GH_PREFIX }}/irssi:latest,${{ env.GH_PREFIX }}/irssi:1.28,${{ env.GH_PREFIX }}/irssi:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.GH_PREFIX }}/irssi:${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/irssi:latest,${{ env.DOCKER_HUB_PREFIX }}/irssi:1.28,${{ env.DOCKER_HUB_PREFIX }}/irssi:1.28-${{ env.GITHUB_SHA_SHORT }},${{ env.DOCKER_HUB_PREFIX }}/irssi:${{ env.GITHUB_SHA_SHORT }}
